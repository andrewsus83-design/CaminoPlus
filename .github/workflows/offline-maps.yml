# Offline map packs: build, measure, test offline rendering, and (on schedule or
# by hand) publish to Cloudflare R2 + register in Supabase offline_packs.
#
# - pull_request touching tools/offline-maps: build stage 1 in several corridor
#   widths / zooms, report the real sizes, prove the pack renders offline. No upload.
# - schedule (monthly) / workflow_dispatch: same build, then publish the default
#   variant if the R2 secrets exist (fresh OSM data each month).
name: offline-maps

on:
  pull_request:
    paths:
      - 'tools/offline-maps/**'
      - '.github/workflows/offline-maps.yml'
  schedule:
    - cron: '17 3 2 * *' # 03:17 UTC on the 2nd of each month (Geofabrik extracts are daily)
  workflow_dispatch:
    inputs:
      publish:
        description: 'Upload to R2 and register in Supabase'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: offline-maps-${{ github.ref }}
  cancel-in-progress: true

env:
  STAGE: stages/camino-frances-01.json
  PLANETILER_VERSION: '0.10.2'

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: tools/offline-maps
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq osmium-tool
          pip install -q -r requirements.txt
          npm ci --no-audit --no-fund || npm install --no-audit --no-fund
          docker pull -q ghcr.io/onthegomap/planetiler:$PLANETILER_VERSION

      # Ocean polygons + Natural Earth (~1 GB) that Planetiler's OpenMapTiles profile needs.
      - uses: actions/cache@v4
        with:
          path: tools/offline-maps/data/sources
          key: planetiler-sources-v1

      - name: Build default pack (3 km corridor, z15)
        run: scripts/build_stage.sh "$STAGE" 3 15

      - name: Measure other corridor widths and zooms
        if: github.event_name == 'pull_request'
        run: |
          for b in 2 5; do scripts/build_stage.sh "$STAGE" $b 15; done
          for b in 2 3 5; do scripts/build_stage.sh "$STAGE" $b 14; done

      - name: Size report
        run: |
          {
            echo "### Offline pack sizes: Saint-Jean-Pied-de-Port to Roncesvalles"
            echo
            echo "| file | corridor | max zoom | size | tiles source |"
            echo "|---|---|---|---|---|"
            python3 - <<'PY'
          import glob, json
          for f in sorted(glob.glob("dist/*.json")):
              m = json.load(open(f))
              if "size_bytes" not in m or "buffer_km" not in m: continue
              print(f"| {m['file']} | {m['buffer_km']:g} km | z{m['maxzoom']} | {m['size_bytes']/1048576:.2f} MB ({m['size_bytes']:,} B) | OSM {m['osm_timestamp']}, route: {m['route_source']} |")
          PY
          } | tee -a "$GITHUB_STEP_SUMMARY"
          ls -la dist

      - name: Render test, network blocked and device offline
        run: |
          npx playwright install --with-deps chromium
          npm run setup
          P=dist/camino-frances-01-3km-z15
          node test/render_offline.mjs $P.pmtiles \
            --route dist/camino-frances-01.route.geojson --corridor $P.corridor.geojson \
            --at -1.3195,43.0094,15 --at -1.2376,43.1636,15 --at -1.2185,43.1097,13
          python3 -c "import json;r=json.load(open('dist/render/camino-frances-01-3km-z15.report.json'));print('render ok:',r['ok']);[print(' ',v['at'],v['features']) for v in r['views']];print('  offline',r['device_offline']['features'])" | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offline-packs
          path: |
            tools/offline-maps/dist/
          retention-days: 14

      - name: Publish to R2 and register in Supabase
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.publish)
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ vars.R2_BUCKET || 'caminoplus-packs' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$R2_ACCOUNT_ID" ]; then
            echo "R2 secrets not set; skipping upload" | tee -a "$GITHUB_STEP_SUMMARY"
            node scripts/publish_pack.mjs dist/camino-frances-01-3km-z15.json --dry-run
            exit 0
          fi
          node scripts/publish_pack.mjs dist/camino-frances-01-3km-z15.json
