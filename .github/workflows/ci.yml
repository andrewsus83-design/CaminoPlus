# Checks that run on every pull request and every push to main.
#
#   mobile            typecheck, unit tests, and an Android bundle of the Expo app
#   supabase          every migration + seed + the SQL smoke tests on a throwaway Postgres with PostGIS
#   edge-functions    the Deno tests of supabase/functions
#   web-sync          web/ is exactly what tools/build_web.py generates, and the design tokens are in step
#   python            compile every Python tool, run the poi-audit and tools tests, check the docs links
#   offline-maps      scripts of the offline map pipeline: syntax, shellcheck, unit tests, and the
#                     render test (network blocked, then device offline) on a tiny fixture pack
#   web-smoke         the web export of the app, every screen opened in light and dark, signed in and signed out,
#                     online and offline: any page error, console error, dropped promise, blank or error screen,
#                     or call to a host nobody mocked fails it (tools/web-smoke/README.md)
#   workflows         actionlint over every workflow
#
# The long jobs of the pipelines themselves live in offline-maps.yml and poi-audit.yml.
# Third-party actions are pinned to a commit (the tag is in the comment); Dependabot bumps them.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  mobile:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - name: Bundle for Android (catches imports and assets Metro cannot resolve)
        run: npx expo export --platform android
        env:
          CI: '1'

  supabase:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Postgres 16 with PostGIS
        # apt has stalled on the runners without printing a line (twice in one afternoon it held this step for 6
        # to 16 minutes; a normal run takes about 25 seconds). Each attempt now prints its progress and has its own
        # limit; a stalled one is stopped, the processes holding apt are listed, and it is tried again.
        timeout-minutes: 15
        run: |
          apt_opts=(-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o DPkg::Lock::Timeout=60)
          for attempt in 1 2 3; do
            if sudo timeout --kill-after=10 90 apt-get "${apt_opts[@]}" update \
              && sudo timeout --kill-after=10 180 apt-get "${apt_opts[@]}" install -y postgresql-16 postgresql-16-postgis-3; then
              exit 0
            fi
            echo "::warning::apt attempt $attempt failed or stalled. Processes holding apt right now:"
            pgrep -a -f "apt-get|dpkg|unattended|apt.systemd" || true
            sudo dpkg --configure -a || true
            sleep 15
          done
          echo "::error::apt did not finish in 3 attempts"
          exit 1
      - name: Migrations, seed and smoke tests
        run: supabase/dev/validate.sh
        env:
          PG_BIN: /usr/lib/postgresql/16/bin

  edge-functions:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - name: Deno tests of every edge function
        run: deno test --allow-net --allow-env --allow-run --allow-read supabase/functions

  web-sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: The pages in web/ are what the generator makes
        run: |
          python3 tools/build_web.py "$RUNNER_TEMP/web-gen"
          fail=0
          for f in "$RUNNER_TEMP"/web-gen/*; do
            name="$(basename "$f")"
            if ! diff -u "web/$name" "$f"; then
              echo "::error file=web/$name::web/$name is out of sync with tools/build_web.py. Run: python3 tools/build_web.py web, then commit"
              fail=1
            fi
          done
          exit "$fail"
      - name: The design tokens are in step (web copy, mobile copy, css vs json)
        run: python3 tools/sync_tokens.py --check

  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/poi-audit/requirements.txt
      - run: pip install -q -r tools/poi-audit/requirements.txt
      - name: Every Python tool compiles
        run: git ls-files -z 'tools/*.py' | xargs -0 python -m py_compile
      - name: POI audit tests
        run: python -m unittest discover -s tools/poi-audit/tests -v
      - name: Tools tests (website generator, design tokens)
        run: python -m unittest discover -s tools/tests -v
      - name: Documentation links and anchors
        run: python tools/check_docs_links.py

  offline-maps:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: tools/offline-maps
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tools/offline-maps/package-lock.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/offline-maps/requirements.txt
      - run: npm ci --no-audit --no-fund
      # osmium, shapely and pyproj are what route_from_osm.py needs; its tests build a tiny PBF and run the real script.
      - run: pip install -q -r requirements.txt
      # The osmium command, the same package the stage builds install: test_merge_extracts.py runs merge_extracts.sh with it.
      - name: Install osmium-tool
        timeout-minutes: 5
        run: |
          sudo apt-get -o Acquire::Retries=3 update -qq
          sudo apt-get -o Acquire::Retries=3 install -y -qq osmium-tool
      - name: Syntax of the scripts
        run: |
          for f in scripts/*.mjs scripts/lib/*.mjs test/*.mjs viewer/style.js; do node --check "$f"; done
          python -m py_compile scripts/*.py
          bash -n scripts/build_stage.sh
          bash -n scripts/merge_extracts.sh
          shellcheck scripts/*.sh
      - name: Unit tests (quality gates, calibration, stage planner, publish against a mock Supabase, dev server, PMTiles header, stage generator, route selection)
        run: |
          npm test
          python -m unittest discover -s test -v
      - name: Stage files are exactly what the catalog generates, and every stage file is valid
        run: |
          python scripts/make_stages.py --check
          python scripts/check_stages.py
      - name: Render test on the fixture pack (network blocked, then device offline)
        run: |
          npx playwright install --with-deps chromium
          npm run setup
          npm run test:render-fixture

  web-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            mobile/package-lock.json
            tools/web-smoke/package-lock.json
      - name: Install the packages of the app
        working-directory: mobile
        run: npm ci --no-audit --no-fund
      - name: Install the packages of the test, and Chromium
        working-directory: tools/web-smoke
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      # First, so a harness that cannot fail never gets to say "green": the test is run against an app built to misbehave.
      - name: Self-test of the smoke test (it must go red on planted failures)
        working-directory: tools/web-smoke
        run: npm test
      - name: Web export of the app
        working-directory: mobile
        run: npx expo export --platform web --output-dir ../tools/web-smoke/dist/app
        env:
          CI: '1'
      - name: Every screen, light and dark, signed in and signed out, online and offline
        working-directory: tools/web-smoke
        run: npm run smoke
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: web-smoke-failures
          # screenshot, report and Playwright trace of every check that failed (open a trace with: npx playwright show-trace <file>)
          path: tools/web-smoke/artifacts
          retention-days: 7
          if-no-files-found: ignore

  workflows:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: actionlint (with shellcheck for the run scripts)
        run: |
          pip install -q actionlint-py==1.7.12.25 shellcheck-py==0.11.0.1
          actionlint
