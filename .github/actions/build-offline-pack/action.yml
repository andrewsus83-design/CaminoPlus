name: Build and test the offline pack
description: >
  Installs the tools, builds the default pack of the stage named in $STAGE (corridor width and max zoom
  come from the stage file), checks its quality band and proves it renders with the network blocked and
  with the device offline. The job environment names the stage: STAGE (stages/<slug>.json, relative to
  tools/offline-maps), SLUG and PACK (<slug>-<buffer_km>km-z<maxzoom>). Both jobs of offline-maps.yml use
  this action, so a pack that gets published is built and tested exactly like a pack that is only
  measured. The pack files stay on the runner: this repository is public, so never upload them as an
  artifact (that would bypass Pilgrim Plus).

inputs:
  route-fallback:
    description: >
      allow: measurement run, the hand-placed route may stand in when OSM has too little of the route.
      deny: publishing run, the build fails instead (a pack from the wrong corridor must not ship).
    default: 'allow'
  ocean-fallback:
    description: >
      allow: measurement run, a coastal stage may be built with Planetiler's placeholder instead of the real ocean
      polygons when osmdata.openstreetmap.de cannot be reached (it often cannot from GitHub's runners). That pack has no sea:
      its manifest says so, and it can be neither published nor calibrated from.
      deny: publishing run, the build fails instead (a coastal pack without the sea must not ship).
    default: 'allow'
  publishing:
    description: "'true' adds the publishing gates (route from OSM, fresh OSM data) to the quality check."
    default: 'false'

runs:
  using: composite
  steps:
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: tools/offline-maps/requirements.txt
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: tools/offline-maps/package-lock.json

    - name: Install tools
      shell: bash
      working-directory: tools/offline-maps
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq osmium-tool
        pip install -q -r requirements.txt
        npm ci --no-audit --no-fund
        docker pull -q "$(scripts/planetiler_image.sh)"

    # Ocean polygons + Natural Earth (~1 GB) that Planetiler's OpenMapTiles profile needs.
    # build_stage.sh checks the pinned files against their SHA-256, so a stale or poisoned cache
    # entry is thrown away instead of used.
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: tools/offline-maps/data/sources
        key: planetiler-sources-v2

    # The OSM extracts of this stage (Geofabrik, 60 to 340 MB each). build_stage.sh keeps them in data/osm
    # and reuses a file that is already there. One cache entry per set of extract URLs and ISO week, so
    # stages that share extracts download them once a week, not once per stage (Geofabrik asks for gentle use).
    # A job saves the cache only when it ends green (actions/cache saves in its post step).
    # No restore-keys on purpose: a fallback to an older week would restore an old extract, build_stage.sh
    # would reuse it, and the post step would save it again under this week's key, so it would never refresh.
    - name: Work out the extract cache key
      id: extracts
      shell: bash
      working-directory: tools/offline-maps
      run: |
        hash="$(python3 -c 'import hashlib, json, sys; urls = sorted(json.load(open(sys.argv[1]))["osm_extracts"]); print(hashlib.sha256("\n".join(urls).encode()).hexdigest()[:16])' "$STAGE")"
        {
          echo "hash=$hash"
          echo "week=$(date -u +%G-W%V)"
        } >> "$GITHUB_OUTPUT"
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: tools/offline-maps/data/osm
        key: osm-extracts-v1-${{ steps.extracts.outputs.hash }}-${{ steps.extracts.outputs.week }}

    - name: Build the pack (corridor width and zoom come from the stage file)
      shell: bash
      working-directory: tools/offline-maps
      env:
        ROUTE_FALLBACK: ${{ inputs.route-fallback }}
        OCEAN_FALLBACK: ${{ inputs.ocean-fallback }}
      run: scripts/build_stage.sh "$STAGE"

    - name: Quality gates (size, tiles, layers, route source)
      shell: bash
      working-directory: tools/offline-maps
      env:
        PUBLISHING: ${{ inputs.publishing }}
      run: |
        flag=""
        if [ "$PUBLISHING" = "true" ]; then flag="--publishing"; fi
        # shellcheck disable=SC2086
        node scripts/check_pack.mjs "dist/$PACK.json" --stage "$STAGE" $flag

    - name: Render test, network blocked and device offline
      shell: bash
      working-directory: tools/offline-maps
      run: |
        npx playwright install --with-deps chromium
        npm run setup
        node test/render_offline.mjs "dist/$PACK.pmtiles" --stage "$STAGE" \
          --route "dist/$SLUG.route.geojson" --corridor "dist/$PACK.corridor.geojson"
      # The test exits 1 on any failed check, so the step summary below only prints for a pass.

    # Shows, per view of the stage file, what was drawn next to the floor the stage file sets. A view
    # without floors (or a stage without render_checks) still gets a line, and a summary that cannot be
    # read never fails the job: the render test above is the gate.
    - name: Render summary
      shell: bash
      working-directory: tools/offline-maps
      run: |
        python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
        import json, os
        try:
            r = json.load(open(f"dist/render/{os.environ['PACK']}.report.json"))
            checks = json.load(open(os.environ["STAGE"])).get("render_checks") or []
            floors = {(c.get("name") or ",".join(map(str, c.get("at") or []))): c for c in checks}
            views = r.get("views") or []
            print(f"render ok: {r.get('ok')}, console/map errors: {len(r.get('errors') or [])}, requests that left the device: {len(r.get('blocked_requests') or [])}")
            for v in views[1:]:  # views[0] is the overview of the whole pack
                c = floors.get(v.get("name")) or {}
                features, layers = v.get("features") or {}, v.get("layers") or {}
                counts = [f"{k} {features.get(k, 0)} (min {n})" for k, n in (c.get("min_features") or {}).items()]
                labels = [f"{k} {layers.get(k, 0)} (min {n})" for k, n in (c.get("min_labels") or {}).items()]
                if counts or labels:
                    print(f"- {v.get('name')}: " + "; ".join(x for x in (", ".join(counts), "labels: " + ", ".join(labels) if labels else "") if x))
                else:
                    top = ", ".join(f"{k} {n}" for k, n in sorted(features.items(), key=lambda kv: -kv[1])[:4]) or "nothing rendered"
                    print(f"- {v.get('name')}: no floors set for this view; most features: {top}")
            if len(views) < 2:
                print("- the stage file has no render_checks, so only the overview of the pack was rendered")
            print(f"- device offline overview: {sum((r.get('device_offline') or {}).get('features', {}).values())} features")
        except Exception as e:  # cosmetic step: say what went wrong, do not fail the job
            print(f"render summary unavailable: {type(e).__name__}: {e}")
        PY
