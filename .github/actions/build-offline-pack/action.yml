name: Build and test the offline pack
description: >
  Installs the tools, builds the default pack of the stage named in $STAGE (3 km corridor, z15),
  checks its quality band and proves it renders with the network blocked and with the device
  offline. Both jobs of offline-maps.yml use it, so a pack that gets published is built and tested
  exactly like a pack that is only measured. The pack files stay on the runner: this repository is
  public, so never upload them as an artifact (that would bypass Pilgrim Plus).

inputs:
  route-fallback:
    description: >
      allow: measurement run, the hand-placed route may stand in when OSM has too little of the route.
      deny: publishing run, the build fails instead (a pack from the wrong corridor must not ship).
    default: 'allow'
  publishing:
    description: "'true' adds the publishing gates (route from OSM, fresh OSM data) to the quality check."
    default: 'false'

runs:
  using: composite
  steps:
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: tools/offline-maps/requirements.txt
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: tools/offline-maps/package-lock.json

    - name: Install tools
      shell: bash
      working-directory: tools/offline-maps
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq osmium-tool
        pip install -q -r requirements.txt
        npm ci --no-audit --no-fund
        docker pull -q "$(scripts/planetiler_image.sh)"

    # Ocean polygons + Natural Earth (~1 GB) that Planetiler's OpenMapTiles profile needs.
    # build_stage.sh checks the pinned files against their SHA-256, so a stale or poisoned cache
    # entry is thrown away instead of used.
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: tools/offline-maps/data/sources
        key: planetiler-sources-v2

    - name: Build default pack (3 km corridor, z15)
      shell: bash
      working-directory: tools/offline-maps
      env:
        ROUTE_FALLBACK: ${{ inputs.route-fallback }}
      run: scripts/build_stage.sh "$STAGE" 3 15

    - name: Quality gates (size, tiles, layers, route source)
      shell: bash
      working-directory: tools/offline-maps
      env:
        PUBLISHING: ${{ inputs.publishing }}
      run: |
        flag=""
        if [ "$PUBLISHING" = "true" ]; then flag="--publishing"; fi
        # shellcheck disable=SC2086
        node scripts/check_pack.mjs "dist/$PACK.json" --stage "$STAGE" $flag

    - name: Render test, network blocked and device offline
      shell: bash
      working-directory: tools/offline-maps
      run: |
        npx playwright install --with-deps chromium
        npm run setup
        node test/render_offline.mjs "dist/$PACK.pmtiles" --stage "$STAGE" \
          --route "dist/$SLUG.route.geojson" --corridor "dist/$PACK.corridor.geojson"
      # The test exits 1 on any failed check, so the step summary below only prints for a pass.

    - name: Render summary
      shell: bash
      working-directory: tools/offline-maps
      run: |
        python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
        import json, os
        r = json.load(open(f"dist/render/{os.environ['PACK']}.report.json"))
        print(f"render ok: {r['ok']}, console/map errors: {len(r['errors'])}, requests that left the device: {len(r['blocked_requests'])}")
        for v in r["views"][1:]:
            f = v["features"]
            print(f"- {v['name']}: " + ", ".join(f"{k} {f.get(k, 0)}" for k in ("poi", "transportation", "building", "mountain_peak")) + f"; labels: place {v['layers'].get('place', 0)}, peak {v['layers'].get('peak', 0)}")
        print(f"- device offline overview: {sum(r['device_offline']['features'].values())} features")
        PY
