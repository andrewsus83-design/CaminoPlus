# Supabase CLI config for CaminoPlus (only the settings we change; everything
# else uses CLI defaults). Secrets come from env vars, never commit them.
project_id = "caminoplus"

[api]
# Only `public` is exposed through the REST API. `private` holds internal
# helpers and secrets and is never exposed.
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[storage]
file_size_limit = "200MiB"

[auth]
site_url = "https://camino.plus"
additional_redirect_urls = [
  "https://camino.plus/auth/callback",
  "caminoplus://auth-callback",
  "caminoplus://**",
  "exp://**",
  "http://localhost:3000/auth/callback",
]
enable_signup = true
jwt_expiry = 3600
enable_refresh_token_rotation = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true
# Emails are sent through Resend via custom SMTP in the hosted project.

[auth.external.google]
enabled = true
client_id = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET)"
# Native Google Sign-In on iOS (signInWithIdToken) does not pass a nonce.
skip_nonce_check = true

# Edge functions (supabase/functions/<name>). Both act on behalf of a signed-in pilgrim, so the
# gateway rejects calls without a valid JWT; each function also validates the token itself.
[functions.offline-pack-url]
verify_jwt = true

[functions.delete-account]
verify_jwt = true
